<!-- Paint the abyss immediately so there is never a white flash before CSS loads -->
<style>
  html,body{background:#04080f;margin:0}
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 38%,#0d3347,#06131f 55%,#02060c)}
  #boot i{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#eafdff,#7defff 40%,#1a8fb4);box-shadow:0 0 60px 8px #3fd6f055;animation:bootpulse 2.2s ease-in-out infinite}
  @keyframes bootpulse{50%{transform:scale(1.12);box-shadow:0 0 90px 16px #3fd6f077}}
  @media (prefers-reduced-motion:reduce){#boot i{animation:none}}
</style>
</head>
<body>
<div id="root"><div id="boot" aria-hidden="true"><i></i></div></div>
<noscript><p style="color:#9cf3ff;font:16px system-ui;padding:24px">Stellara needs JavaScript to run Python in your browser.</p></noscript>
<script type="module" src="/src/main.tsx"></script>
</body>
